plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp' // For Room and Hilt
}

android {
    namespace 'com.example.tnotes'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tnotes"
        minSdk 24 // API Level 24 (Android 7.0 Nougat)
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false // Enable ProGuard/R8 for release builds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion composeCompilerVersion // From project build.gradle
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:$coreKtxVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.activity:activity-compose:$activityVersion"

    // Jetpack Compose Bill of Materials (BOM)
    implementation platform("androidx.compose:compose-bom:$composeVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3" // Material Design 3
    // Optional: Material icons
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"


    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion" // For collectAsStateWithLifecycle


    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // Room (for local database)
    implementation "androidx.room:room-runtime:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion" // Kotlin Extensions and Coroutines support for Room

    // Hilt (for Dependency Injection)
    implementation "com.google.dagger:hilt-android:2.50"
    ksp "com.google.dagger:hilt-compiler:2.50"
    // Hilt Navigation Compose
    implementation "androidx.hilt:hilt-navigation-compose:$hiltNavigationComposeVersion"

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Coil for image loading
    implementation "io.coil-kt:coil-compose:2.6.0"


    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Coroutines Test
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    // For InstantTaskExecutorRule if using LiveData (good for general ViewModel testing)
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    // Google Truth for assertions
    testImplementation "com.google.truth:truth:1.1.5"
    androidTestImplementation "com.google.truth:truth:1.1.5"


    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform("androidx.compose:compose-bom:$composeVersion")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    // Hilt testing
    androidTestImplementation "com.google.dagger:hilt-android-testing:2.50"
    kspAndroidTest "com.google.dagger:hilt-compiler:2.50"


    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

// Allow references to generated code
ksp {
    correctErrorTypes = true
}
